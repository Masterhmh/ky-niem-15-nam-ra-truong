<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kỷ Niệm 15 Năm Ngày Ra Trường — Lớp 12A1, 2012 - 2027 | Trường THPT Số 1 Mường Khương</title>
<meta name="description" content="Quyển sách thiệp mời kỷ niệm 15 năm ngày ra trường của Lớp 12A1, 2012 - 2027. Thời gian: 9 giờ 00, Thứ Sáu, ngày 01/01/2027 tại Trường THPT Số 1 Mường Khương.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF8; --ink:#14213D; --navy:#0E1B33; --navy2:#1B2F55;
    --gold:#C5A059; --gold-light:#E6C987; --gold-dark:#8C6D2E; --line:rgba(197,160,89,.45); --muted:#5D6B82;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(700px 420px at 50% -80px,rgba(230,201,135,.28),transparent 60%),radial-gradient(1000px 600px at 50% 0%,#24365F,transparent 60%),linear-gradient(180deg,#0E1B33,#16294D 55%,#0E1B33);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;line-height:1.8;min-height:100vh}
  a{color:inherit}
  .serif{font-family:"Playfair Display",Georgia,serif}
  .gold-text{background:linear-gradient(105deg,#8C6D2E,#C5A059 32%,#F0D48A 52%,#C5A059 72%,#8C6D2E);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
  @keyframes shine{0%,100%{background-position:0% center}50%{background-position:100% center}}
  .small{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
  .icon{width:32px;height:32px;stroke:var(--gold-dark);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 56px}

  .book{position:relative;background:linear-gradient(135deg,#0B1526,#1B2F55 55%,#0E1B33);padding:13px;border:1px solid rgba(230,201,135,.5);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
  .book:before{content:"";position:absolute;inset:7px;border:1px solid rgba(230,201,135,.35);border-radius:16px;pointer-events:none;z-index:30}
  .book-stage{position:relative;height:clamp(640px, calc(100svh - 170px), 780px);overflow:hidden;perspective:2000px;cursor:grab}
  .page{position:relative;background:linear-gradient(180deg,#FFFEFA,#FFFDF8 60%,#FBF3DF);padding:48px 48px 56px;height:100%;overflow:hidden;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(197,160,89,.35), inset 0 -30px 60px rgba(197,160,89,.08)}
  .page:before{content:"";position:absolute;inset:12px;border:1px solid rgba(197,160,89,.25);border-radius:10px;pointer-events:none}
  .page:after{content:"";position:absolute;top:0;bottom:0;left:0;width:10px;background:linear-gradient(90deg,rgba(20,33,61,.16),transparent);pointer-events:none}
  .page.is-cover{background:linear-gradient(180deg,#0E1B33,#1B2F55);color:#F6F1E7}
  .page.is-cover .small{color:#D9C48A}
  .page.is-cover p{color:#D9C9A8}
  .page.is-cover strong{color:#FFFDF8}

  /* Tờ giấy lật thật: xoay quanh gáy trái, chậm 1,4 giây, có bóng đổ ở mép. */
  .turn-sheet{position:absolute;inset:0;z-index:20;display:none;transform-origin:left center;transform:rotateY(0deg);transition:transform 1.5s cubic-bezier(.22,1,.36,1);backface-visibility:hidden;will-change:transform}
  .turn-sheet{border-radius:14px;overflow:hidden}
  .turn-sheet .turn-inner{position:absolute;inset:0;background:linear-gradient(180deg,#FFFEFA,#FFFDF8 60%,#FBF3DF);padding:48px 48px 56px;border-radius:14px;box-shadow:24px 0 60px rgba(0,0,0,.35)}
  .turn-sheet .turn-inner:before{content:"";position:absolute;inset:12px;border:1px solid rgba(197,160,89,.25);border-radius:10px;pointer-events:none}
  .turn-sheet .turn-inner:after{content:"";position:absolute;top:0;bottom:0;right:0;width:42px;background:linear-gradient(90deg,transparent,rgba(20,33,61,.28));pointer-events:none}
  .turn-sheet.is-cover .turn-inner{background:linear-gradient(180deg,#0E1B33,#1B2F55);color:#F6F1E7}
  .turn-sheet.is-cover .turn-inner .small{color:#D9C48A}

  h2.sec{font-family:"Playfair Display",serif;font-size:clamp(26px,4vw,34px);line-height:1.3;margin:0 0 8px;text-align:center;font-weight:700}
  .sec-sub{text-align:center;color:var(--muted);margin:0 0 28px}
  .ornament{display:flex;align-items:center;gap:14px;justify-content:center;margin:14px auto;color:var(--gold)}
  .ornament:before,.ornament:after{content:"";height:1px;width:64px;background:var(--line)}
  .btn{display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;background:var(--navy);color:#fff;padding:14px 26px;border-radius:999px;font-weight:600;letter-spacing:.4px;transition:transform .3s ease,box-shadow .3s ease;text-decoration:none;position:relative;overflow:hidden}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(14,27,51,.28)}
  .btn.gold{background:linear-gradient(105deg,#8C6D2E,#C5A059,#E6C987);color:#14213D}
  .btn.gold:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s ease}
  .btn.gold:hover:after{left:130%}
  .btn.light{background:#fff;color:var(--navy);border:1px solid var(--line)}
  @keyframes pageIn{from{opacity:.35}to{opacity:1}}
  .page-in{animation:pageIn .6s ease}
  .chapter{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dark);font-weight:600;text-align:center;margin:0 0 6px}
  .prompt-box{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:rgba(197,160,89,.08);text-align:center;cursor:pointer}
  .prompt-btn{display:block;width:100%;background:transparent;border:0;color:var(--gold-dark);font-weight:700;cursor:pointer;font-size:15px;letter-spacing:.06em;padding:10px 6px}
  .prompt-text{margin:6px 0 0;font-size:14px;line-height:1.5;text-wrap:balance;color:var(--ink)}
  .prompt-count{display:block;margin-top:6px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .progress{height:3px;background:rgba(230,201,135,.25);border-radius:999px;margin-top:16px;overflow:hidden}
  .progress div{height:100%;background:linear-gradient(90deg,#8C6D2E,#E6C987);border-radius:999px;transition:width .6s ease}
  .dust{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;opacity:.35}
  .dust i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:#E6C987;animation:rise 14s linear infinite}
  .dust i:nth-child(1){left:8%;animation-delay:0s}.dust i:nth-child(2){left:22%;animation-delay:3s;animation-duration:17s}.dust i:nth-child(3){left:38%;animation-delay:6s}.dust i:nth-child(4){left:55%;animation-delay:1s;animation-duration:19s}.dust i:nth-child(5){left:70%;animation-delay:8s}.dust i:nth-child(6){left:85%;animation-delay:4s;animation-duration:16s}.dust i:nth-child(7){left:93%;animation-delay:10s}.dust i:nth-child(8){left:47%;animation-delay:12s}
  @keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-105vh);opacity:0}}
  .cover{text-align:center;padding-top:48px}
  .cover p{text-wrap:balance}
  .seal{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#F0D48A,#C5A059 60%,#8C6D2E);color:#fff;font-family:"Playfair Display",serif;font-size:28px;font-weight:900;box-shadow:0 14px 28px rgba(140,109,46,.4)}
  .cover .big{font-size:clamp(90px,20vw,150px);line-height:.85;margin:10px 0 0;font-weight:900}
  .cover h1{font-size:clamp(30px,5.5vw,48px);line-height:1.25;margin:10px 0;font-weight:700;text-wrap:balance}
  .letter{font-size:16px;line-height:1.6;text-align:justify;text-align-last:left}
  .letter p{margin:0 0 12px}
  .detail{display:flex;align-items:flex-start;gap:14px;justify-content:flex-start;max-width:520px;margin:16px auto;font-size:18px}
  .detail-text span{display:block;line-height:1.55;text-wrap:balance}
  .detail-text .d2{font-size:16px;color:var(--muted)}
  .foot-note{color:var(--muted);font-size:15px;line-height:1.65;text-wrap:balance}
  .quote{font-size:clamp(20px,4.5vw,26px);line-height:1.55;text-wrap:balance}
  .count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:26px auto 0}
  .count div{background:var(--navy);color:#fff;padding:16px 6px;text-align:center;border:1px solid rgba(230,201,135,.35)}
  .count b{display:block;font-family:"Playfair Display",serif;font-size:clamp(26px,5vw,38px);line-height:1;color:var(--gold-light)}
  .count span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
  .count-label{text-align:center;color:var(--muted);margin:24px 0 0;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .detail .icon{width:24px;height:24px}
  .timeline{max-width:600px;margin:0 auto;border-left:1px solid var(--line);padding-left:28px}
  .timeline article{position:relative;padding:0 0 20px}
  .timeline article:before{content:"";position:absolute;left:-35px;top:7px;width:13px;height:13px;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);transform:rotate(45deg)}
  .timeline h4{margin:0;font-size:18px;text-wrap:balance}
  .timeline p{margin:4px 0 0;color:var(--muted)}
  .center{text-align:center}
  .actions{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;margin-top:24px}
  .actions .btn{min-width:260px;justify-content:center}
  #rsvpMsg{margin-top:16px;font-weight:600;color:#1F6B3A;min-height:24px;text-align:center;text-wrap:balance}
  .rsvp-modal{position:fixed;inset:0;background:rgba(10,20,40,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .rsvp-modal.open{display:flex}
  .rsvp-card{background:#FFFEFA;border:1px solid rgba(197,160,89,.6);border-radius:20px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.5);text-align:left}
  .rsvp-card h3{font-family:"Playfair Display",serif;font-size:24px;margin:0;text-align:center}
  .rsvp-choice{text-align:center;color:var(--gold-dark);font-weight:700;margin:8px 0 4px}
  .rsvp-card label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
  .rsvp-card input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;color:var(--ink)}
  #rsvpError{margin:10px 0 0;font-size:14px;color:#B42318;min-height:20px;text-align:center}

  .book-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .navbtn{background:transparent;border:1px solid rgba(230,201,135,.5);border-radius:999px;color:#F0D48A;padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center}
  .navbtn:disabled{opacity:.3;cursor:default}
  .navbtn .icon{width:20px;height:20px;stroke:currentColor}
  .page-ind{color:#D9C48A;font-size:14px;letter-spacing:.18em}
  .music-row{display:flex;justify-content:center;margin-top:14px}
  #musicBtn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:1px solid rgba(230,201,135,.5);padding:11px 20px;border-radius:999px;cursor:pointer;font-weight:600;box-shadow:0 14px 30px rgba(14,27,51,.4)}
  #musicBtn .icon{width:18px;height:18px;stroke:var(--gold-light)}
  #bgAudio{display:none}
  @media(max-width:680px){
    .page,.turn-sheet .turn-inner{padding:32px 26px 44px}
    .letter{font-size:17px}
  }
  @media(prefers-reduced-motion:reduce){
    .turn-sheet{transition:none}
    .dust{display:none}
  }
</style>
</head>
<body>
<div class="dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="book" id="book">
    <div class="book-stage" id="stage">
      <div class="page" id="page"></div>
      <div class="turn-sheet" id="turnSheet"><div class="turn-inner" id="turnInner"></div></div>
    </div>
  </div>
  <div class="book-nav">
    <button class="navbtn" id="prevBtn" type="button" aria-label="Trang trước"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="page-ind" id="pageInd">1 / 8</div>
    <button class="navbtn" id="nextBtn" type="button" aria-label="Trang sau"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="progress"><div id="progressBar" style="width:12.5%"></div></div>
  <div class="music-row">
    <button id="musicBtn" type="button" aria-label="Bật hoặc tắt nhạc nền">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span id="musicLabel">Bật Nhạc</span>
    </button>
  </div>
</div>

<audio id="bgAudio" src="music.mp3" loop preload="auto"></audio>

<script>
  const $ = id => document.getElementById(id);
  const pages = [
    {
      cover: true,
      html: `<div class="cover">
        <div class="small">Trân Trọng Kính Mời • Lớp 12A1</div>
        <div class="big serif gold-text">15</div>
        <div class="serif" style="font-size:20px;letter-spacing:.42em">NĂM</div>
        <h1 class="serif">Kỷ Niệm Ngày<br>Ra Trường</h1>
        <div class="ornament"><span>◆</span></div>
        <p><strong>Trường THPT Số 1 Mường Khương</strong><br>2012 — 2027</p>
        <p>Thứ Sáu • 01/01/2027 • 9 Giờ 00</p>
        <div class="actions"><button class="btn gold" type="button" data-action="open-book">Mở Sách</button></div>
      </div>`
    },
    {
      html: `<div class="chapter">Mở Đầu</div>
        <h2 class="sec">Lời Mở Đầu</h2>
        <div class="ornament"><span>◆</span></div>
        <div class="letter">
          <p>Mười lăm năm trước, chúng ta cùng bước vào một lớp học, cùng ngồi dưới một mái trường, cùng lớn lên trong những buổi sáng đến lớp và những buổi chiều tan học vội vã.</p>
          <p>Thời gian đưa mỗi người đi một hướng khác nhau. Có người ở lại quê hương, có người lập nghiệp nơi xa, nhưng có một điều không thay đổi: chúng ta vẫn là Lớp 12A1 của nhau.</p>
          <p>Cuốn sách này là lời hẹn trở về. Hãy mở từng trang thật chậm, để đến trang cuối cùng, chúng ta lại gặp nhau.</p>
          <p style="text-align:right"><em>Thân gửi Lớp 12A1.</em></p>
        </div>`
    },
    {
      html: `<div class="chapter">Chương 1</div>
        <h2 class="sec">Lớp Học Năm Ấy</h2>
        <div class="ornament"><span>◆</span></div>
        <div class="letter">
          <p>Nhớ những buổi sáng đến lớp, tiếng trống trường vang lên, cả lớp vội vã vào chỗ ngồi, bảng đen còn thơm mùi phấn mới.</p>
          <p>Giờ ra chơi, sân trường rộn ràng tiếng cười. Những câu chuyện chưa kể hết đã phải quay lại lớp, hẹn nhau kể tiếp vào giờ sau.</p>
          <p>Có những bài học khó, những lần kiểm tra hồi hộp, những lúc giận nhau rồi lại làm lành ngay trong ngày. Ngồi cạnh nhau, mọi thứ đều nhẹ nhàng hơn rất nhiều.</p>
        </div>
        <div class="prompt-box"><button class="prompt-btn" type="button" data-i="0" data-prompts="Chỗ ngồi của bạn ở đâu — gần cửa sổ hay gần bảng?|Ai là người bạn cùng bàn mà bạn nhớ nhất?|Tiếng trống trường ngày ấy, bạn còn nhớ không?">Xem Câu Hỏi Khác</button><p class="prompt-text">Chỗ ngồi của bạn ở đâu — gần cửa sổ hay gần bảng?</p><span class="prompt-count">Câu hỏi 1 / 3</span></div>`
    },
    {
      html: `<div class="chapter">Chương 2</div>
        <h2 class="sec">Mùa Hè Chia Tay</h2>
        <div class="ornament"><span>◆</span></div>
        <div class="letter">
          <p>Mùa hè cuối cùng đến rất nhanh. Khi những ngày cuối năm học trôi qua, ai cũng hiểu rằng mình sắp phải xa nhau, xa những người bạn đã gắn bó suốt bao năm.</p>
          <p>Ngày chia tay, không ai nói được nhiều. Chỉ một cái ôm, một lời hẹn gặp lại, và một nỗi buồn lặng lẽ mà mãi sau này mới hiểu hết.</p>
          <p>Mỗi người mang theo một ước mơ, rời khỏi mái trường, mang theo cả một phần tuổi trẻ của nhau. Và từ đó, chúng ta bắt đầu một hành trình dài mang tên trưởng thành.</p>
        </div>
        <div class="prompt-box"><button class="prompt-btn" type="button" data-i="0" data-prompts="Ngày chia tay ấy, bạn đã nói gì với người bạn thân nhất?|Có điều gì đến giờ bạn vẫn chưa kịp nói không?|Mùa hè năm ấy, bạn mang theo ước mơ gì?">Xem Câu Hỏi Khác</button><p class="prompt-text">Ngày chia tay ấy, bạn đã nói gì với người bạn thân nhất?</p><span class="prompt-count">Câu hỏi 1 / 3</span></div>`
    },
    {
      html: `<div class="chapter">Chương 3</div>
        <h2 class="sec">Mười Lăm Năm Sau</h2>
        <div class="ornament"><span>◆</span></div>
        <div class="letter">
          <p>Mười lăm năm trôi qua, tóc đã khác, cuộc sống đã khác, nhưng mỗi khi nghe một bài hát cũ, lòng lại trở về lớp học năm ấy, nơi có những người bạn chưa bao giờ quên.</p>
          <p>Có những người bạn lâu rồi chưa gặp, có những cái tên chỉ cần nhắc đến là cả một thời học trò ùa về, với tiếng cười và những ước mơ còn dang dở.</p>
          <p>Và rồi một ngày, chúng ta nhận ra: điều quý nhất không phải là thời gian đã qua, mà là những người đã cùng mình đi qua thời gian ấy. Vì vậy, ngày hội ngộ này mới thật đáng chờ đợi.</p>
        </div>
        <div class="prompt-box"><button class="prompt-btn" type="button" data-i="0" data-prompts="Nếu gặp lại nhau vào ngày 01/01/2027, điều đầu tiên bạn muốn nói với cả lớp là gì?|Một bài hát cũ nào khiến bạn nhớ về lớp học ngay lập tức?|Bạn muốn gặp lại ai nhất trong ngày hội ngộ này?">Xem Câu Hỏi Khác</button><p class="prompt-text">Nếu gặp lại nhau vào ngày 01/01/2027, điều đầu tiên bạn muốn nói với cả lớp là gì?</p><span class="prompt-count">Câu hỏi 1 / 3</span></div>`
    },
    {
      html: `<h2 class="sec">Lời Mời</h2>
        <div class="ornament"><span>◆</span></div>
        <div class="letter">

      </div>`
    }
  ];

  let current = 0, animating = false;
  const pageEl = $('page'), sheet = $('turnSheet'), sheetInner = $('turnInner');
  function render(){
    pageEl.innerHTML = pages[current].html;
    pageEl.classList.remove('page-in'); void pageEl.offsetWidth; pageEl.classList.add('page-in');
    $('progressBar').style.width = ((current + 1) / pages.length * 100) + '%';
    pageEl.classList.toggle('is-cover', !!pages[current].cover);
    $('pageInd').textContent = (current + 1) + ' / ' + pages.length;
    $('prevBtn').disabled = current === 0;
    $('nextBtn').disabled = current === pages.length - 1;
  }
  function setSheetFor(index){
    sheetInner.innerHTML = pages[index].html;
    sheet.classList.toggle('is-cover', !!pages[index].cover);
  }
  function goTo(index, fromCover){
    if (animating || index < 0 || index >= pages.length || index === current) return;
    const dir = index > current ? 'next' : 'prev';
    animating = true;
    if (dir === 'next') {
      // Tờ giấy hiện tại xoay từ từ sang trái, trang mới lộ ra ở dưới khi tờ giấy gần dựng đứng.
      setSheetFor(current);
      sheet.style.transition = 'none'; sheet.style.transform = 'rotateY(0deg)'; sheet.style.display = 'block';
      void sheet.offsetWidth;
      sheet.style.transition = 'transform 1.5s cubic-bezier(.22,1,.36,1)'; sheet.style.transform = 'rotateY(-180deg)';
      setTimeout(() => { current = index; render(); }, 750);
      setTimeout(() => { sheet.style.display = 'none'; sheet.style.transform = 'rotateY(0deg)'; animating = false; }, 1550);
    } else {
      // Tờ giấy của trang trước đi từ trái sang phải, phủ dần trang hiện tại rồi mới lộ trang trước.
      setSheetFor(index);
      sheet.style.transition = 'none'; sheet.style.transform = 'rotateY(-180deg)'; sheet.style.display = 'block';
      void sheet.offsetWidth;
      sheet.style.transition = 'transform 1.5s cubic-bezier(.22,1,.36,1)'; sheet.style.transform = 'rotateY(0deg)';
      setTimeout(() => { current = index; render(); sheet.style.display = 'none'; sheet.style.transform = 'rotateY(0deg)'; animating = false; }, 1550);
    }
    if (!musicAutoStarted && index >= 1) { musicAutoStarted = true; startMusic(); }
  }
  function next(){ goTo(current + 1); }
  function prev(){ goTo(current - 1); }
  $('nextBtn').addEventListener('click', next);
  $('prevBtn').addEventListener('click', prev);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });
  let touchX = null;
  $('stage').addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
  $('stage').addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (dx < -45) next(); else if (dx > 45) prev();
    touchX = null;
  }, {passive:true});
  $('stage').addEventListener('click', e => {
    if (e.target.closest('button, a, .prompt-box')) return;
    const rect = $('stage').getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x > rect.width * 0.72) next();
    else if (x < rect.width * 0.28) prev();
  });

  // Nhạc nền phát từ file music.mp3 trong repo, có nút Tắt/Bật. Nếu file chưa tải được thì dùng giai điệu dự phòng.
  let musicOn = false, musicAutoStarted = false;
  let audioCtx = null, musicTimer = null, noteIndex = 0;
  const melody = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33];
  function playNote(freq){
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.07, now + 0.45);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + 2.0);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 2.1);
  }
  function startFallback(){
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; } }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (musicTimer) return;
    musicTimer = setInterval(() => { playNote(melody[noteIndex % melody.length]); noteIndex++; }, 2100);
    playNote(melody[0]); noteIndex = 1;
  }
  function stopFallback(){ if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
  function setMusicLabel(){ $('musicLabel').textContent = musicOn ? 'Tắt Nhạc' : 'Bật Nhạc'; }
  function startMusic(){
    if (musicOn) return;
    musicOn = true; setMusicLabel();
    const audio = $('bgAudio');
    if (audio) {
      audio.volume = 0.5;
      const played = audio.play();
      if (played && played.catch) played.catch(() => { if (musicOn) startFallback(); });
      audio.addEventListener('error', () => { if (musicOn) startFallback(); }, { once: true });
      return;
    }
    startFallback();
  }
  function stopMusic(){
    musicOn = false; setMusicLabel(); stopFallback();
    const audio = $('bgAudio');
    if (audio) { try { audio.pause(); } catch(e) {} }
  }
  $('musicBtn').addEventListener('click', () => { musicAutoStarted = true; musicOn ? stopMusic() : startMusic(); });

  document.addEventListener('click', e => {
    const promptBox = e.target.closest('.prompt-box');
    if (promptBox) {
      const promptBtn = promptBox.querySelector('.prompt-btn');
      const prompts = promptBtn.dataset.prompts.split('|');
      const next = (parseInt(promptBtn.dataset.i || '0', 10) + 1) % prompts.length;
      promptBtn.dataset.i = next;
      const text = promptBox.querySelector('.prompt-text');
      if (text) text.textContent = prompts[next];
      const count = promptBox.querySelector('.prompt-count');
      if (count) count.textContent = 'Câu hỏi ' + (next + 1) + ' / ' + prompts.length;
      return;
    }
    const act = e.target.closest('[data-action]');
    if (act && act.dataset.action === 'open-book') { goTo(1, true); return; }
    const rsvp = e.target.closest('[data-rsvp]');
    if (rsvp) {
      const modal = $('rsvpModal');
      if (modal) { modal.dataset.choice = rsvp.dataset.rsvp; modal.classList.add('open'); }
      const choiceEl = $('rsvpChoice'); if (choiceEl) choiceEl.textContent = 'Bạn xác nhận: ' + rsvp.dataset.rsvp;
      const err = $('rsvpError'); if (err) err.textContent = '';
      const nameEl = $('rsvpName'); if (nameEl) setTimeout(() => nameEl.focus(), 50);
      return;
    }
    if (e.target.closest('#rsvpCancel') || e.target.id === 'rsvpModal') {
      const modal = $('rsvpModal'); if (modal) modal.classList.remove('open');
      return;
    }
    if (e.target.closest('#rsvpSend')) {
      const modal = $('rsvpModal');
      const nameEl = $('rsvpName'), phoneEl = $('rsvpPhone'), err = $('rsvpError'), msg = $('rsvpMsg');
      const name = nameEl ? nameEl.value.trim() : '';
      const phone = phoneEl ? phoneEl.value.replace(/\D/g, '') : '';
      if (!name) { if (err) err.textContent = 'Bạn vui lòng nhập họ và tên trước khi gửi.'; if (nameEl) nameEl.focus(); return; }
      if (!/^0\d{9}$/.test(phone)) { if (err) err.textContent = 'Số điện thoại cần đủ 10 số và bắt đầu bằng số 0.'; if (phoneEl) phoneEl.focus(); return; }
      if (err) err.textContent = '';
      // Điền khi có Form/Sheet: RSVP_ENDPOINT là địa chỉ formResponse của Google Form liên kết với Sheet mới,
      // RSVP_FIELDS là 3 mã entry của 3 câu hỏi Họ và tên, Số điện thoại, Xác nhận. Chưa điền thì chưa gửi lên Sheet.
      // Không mở trang biểu mẫu: chỉ gửi ngầm trong nền, người dùng ở lại trong quyển sách.
      const RSVP_ENDPOINT = 'https://docs.google.com/forms/d/e/1FAIpQLSebNQLPKc1FsZSU4_S9bnA90uKVRlP3sB2icpHYwsGxvw9mQw/formResponse';
      const RSVP_FIELDS = { name: 'entry.1478877037', phone: 'entry.496907100', choice: 'entry.165629815' };
      const choice = modal ? modal.dataset.choice : '';
      const done = () => {
        if (modal) modal.classList.remove('open');
        if (msg) msg.textContent = 'Cảm ơn ' + name + ' đã xác nhận: ' + choice + '. Hẹn gặp bạn vào ngày 01/01/2027.';
        if (nameEl) nameEl.value = ''; if (phoneEl) phoneEl.value = '';
        try { localStorage.setItem('rsvp-15-nam', choice); } catch(e2) {}
      };
      if (!RSVP_ENDPOINT || !RSVP_FIELDS.name || !RSVP_FIELDS.phone || !RSVP_FIELDS.choice) {
        if (err) err.textContent = 'Form xác nhận đang chờ kết nối Google Sheet, chưa gửi được. Vui lòng quay lại sau.';
        return;
      }
      const fd = new FormData();
      fd.append(RSVP_FIELDS.name, name); fd.append(RSVP_FIELDS.phone, phone); fd.append(RSVP_FIELDS.choice, choice);
      fetch(RSVP_ENDPOINT, { method: 'POST', mode: 'no-cors', body: fd })
        .then(done)
        .catch(() => { if (err) err.textContent = 'Gửi chưa thành công, bạn vui lòng bấm lại.'; });
    }
  });

  // Đếm ngược tới 9 giờ 00 ngày 01/01/2027, chạy lại mỗi giây và chỉ cập nhật khi trang Lời mời đang hiển thị.
  const targetDate = new Date('2027-01-01T09:00:00+07:00');
  function tick(){
    const d = $('d'); if (!d) return;
    let diff = Math.max(0, targetDate - new Date());
    const days = Math.floor(diff / 86400000); diff -= days * 86400000;
    const hrs = Math.floor(diff / 3600000); diff -= hrs * 3600000;
    const mins = Math.floor(diff / 60000); diff -= mins * 60000;
    const secs = Math.floor(diff / 1000);
    d.textContent = days; $('h').textContent = String(hrs).padStart(2,'0');
    $('m').textContent = String(mins).padStart(2,'0'); $('s').textContent = String(secs).padStart(2,'0');
  }
  setInterval(tick, 1000);

  render(); tick();
</script>

    <input id="rsvpName" type="text" autocomplete="name" placeholder="Nhập họ và tên của bạn">

    <input id="rsvpPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Nhập số điện thoại 10 số">

    <div class="actions">
      <button class="btn gold" type="button" id="rsvpSend">Gửi Xác Nhận</button>
      <button class="btn light" type="button" id="rsvpCancel">Đóng</button>
