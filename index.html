<html lang="vi">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F6F1E7; --paper:#FFFDF8; --paper2:#FBF6EA; --ink:#14213D; --navy:#0E1B33; --navy2:#1B2F55;
    --gold:#C5A059; --gold-light:#E6C987; --gold-dark:#8C6D2E; --line:rgba(197,160,89,.45); --muted:#5D6B82;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(1000px 600px at 50% 0%,#24365F,transparent 60%),linear-gradient(180deg,#0E1B33,#16294D 55%,#0E1B33);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;line-height:1.75;min-height:100vh}
  a{color:inherit}
  .serif{font-family:"Playfair Display",Georgia,serif}
  .gold-text{background:linear-gradient(105deg,#8C6D2E,#C5A059 32%,#F0D48A 52%,#C5A059 72%,#8C6D2E);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
  @keyframes shine{0%,100%{background-position:0% center}50%{background-position:100% center}}
  .small{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
  .icon{width:34px;height:34px;stroke:var(--gold-dark);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
  .topbar{text-align:center;color:#D9C48A;padding:14px 0 6px}
  .topbar .small{color:#D9C48A}

  /* Book */
  .book{position:relative;background:linear-gradient(90deg,#0B1526,#14213D 12%,#0E1B33);padding:14px;border:1px solid rgba(230,201,135,.5);box-shadow:0 40px 90px rgba(0,0,0,.5)}
  .book:before{content:"";position:absolute;inset:7px;border:1px solid rgba(230,201,135,.35);pointer-events:none}
  .book-stage{position:relative;background:var(--paper);min-height:640px;overflow:hidden;perspective:1600px;
    box-shadow:inset 0 0 0 1px rgba(197,160,89,.35)}
  .book-stage:after{content:"";position:absolute;top:0;bottom:0;right:0;width:14px;background:repeating-linear-gradient(90deg,#fff 0 2px,#EDE4CF 2px 4px);border-left:1px solid rgba(197,160,89,.4);pointer-events:none}
  .book-stage:before{content:"";position:absolute;top:0;bottom:0;left:0;width:10px;background:linear-gradient(90deg,rgba(20,33,61,.18),transparent);pointer-events:none;z-index:3}
  .page{position:relative;padding:52px 48px 44px;min-height:640px}
  .page:before{content:"";position:absolute;inset:12px;border:1px solid rgba(197,160,89,.25);pointer-events:none}
  .page.turn-next{animation:turnNext .85s cubic-bezier(.3,.7,.3,1) both}
  .page.turn-prev{animation:turnPrev .85s cubic-bezier(.3,.7,.3,1) both}
  @keyframes turnNext{0%{opacity:1;transform:rotateY(0) translateX(0)}45%{opacity:.2;transform:rotateY(-38deg) translateX(-46px)}100%{opacity:1;transform:rotateY(0) translateX(0)}}
  @keyframes turnPrev{0%{opacity:1;transform:rotateY(0) translateX(0)}45%{opacity:.2;transform:rotateY(38deg) translateX(46px)}100%{opacity:1;transform:rotateY(0) translateX(0)}}
  .page h2.sec{font-family:"Playfair Display",serif;font-size:clamp(27px,4vw,37px);line-height:1.3;margin:0 0 8px;text-align:center;font-weight:700}
  .sec-sub{text-align:center;color:var(--muted);margin:0 0 26px}
  .ornament{display:flex;align-items:center;gap:14px;justify-content:center;margin:24px auto;color:var(--gold)}
  .ornament:before,.ornament:after{content:"";height:1px;width:64px;background:var(--line)}
  .btn{display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;background:var(--navy);color:#fff;padding:14px 24px;border-radius:2px;font-weight:600;letter-spacing:.4px;transition:transform .3s ease,box-shadow .3s ease;text-decoration:none;position:relative;overflow:hidden}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(14,27,51,.28)}
  .btn.gold{background:linear-gradient(105deg,#8C6D2E,#C5A059,#E6C987);color:#14213D}
  .btn.gold:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s ease}
  .btn.gold:hover:after{left:130%}
  .btn.light{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn .icon{width:18px;height:18px;stroke:currentColor}

  .cover{text-align:center;padding-top:64px}
  .seal{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#F0D48A,#C5A059 60%,#8C6D2E);color:#fff;font-family:"Playfair Display",serif;font-size:34px;font-weight:900;box-shadow:0 14px 28px rgba(140,109,46,.4)}
  .cover .big{font-size:clamp(110px,22vw,180px);line-height:.85;margin:14px 0 0;font-weight:900}
  .cover h1{font-size:clamp(30px,5.5vw,48px);line-height:1.25;margin:10px 0;font-weight:700}
  .class-badge{display:inline-flex;align-items:center;gap:9px;margin-top:16px;background:var(--navy);color:var(--gold-light);padding:10px 20px;letter-spacing:.22em;font-weight:600;font-size:14px}
  .class-badge .icon{width:20px;height:20px;stroke:var(--gold-light)}
  .letter{font-size:18px;text-align:justify}
  .letter p{margin:0 0 16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .info{background:#fff;border:1px solid var(--line);padding:24px 16px;text-align:center}
  .info .icon{margin:0 auto 10px;width:38px;height:38px}
  .info h4{margin:6px 0;font-size:17px}
  .info p{margin:0;color:var(--muted);font-size:15px}
  .count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:620px;margin:0 auto}
  .count div{background:var(--navy);color:#fff;padding:18px 6px;text-align:center;border:1px solid rgba(230,201,135,.35)}
  .count b{display:block;font-family:"Playfair Display",serif;font-size:clamp(28px,5vw,42px);line-height:1;color:var(--gold-light)}
  .count span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
  .timeline{max-width:620px;margin:0 auto;border-left:1px solid var(--line);padding-left:28px}
  .timeline article{position:relative;padding:0 0 26px}
  .timeline article:before{content:"";position:absolute;left:-35px;top:7px;width:13px;height:13px;background:var(--gold);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);transform:rotate(45deg)}
  .timeline h4{margin:0;font-size:18px}
  .timeline p{margin:4px 0 0;color:var(--muted)}
  .quote{text-align:center}
  .quote .serif{font-size:clamp(22px,3.5vw,30px);line-height:1.5}
  .center{text-align:center}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
  #rsvpMsg{margin-top:16px;font-weight:600;color:#1F6B3A;min-height:24px;text-align:center}

  .book-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
  .book-nav .navbtn{background:transparent;border:1px solid rgba(230,201,135,.5);color:#F0D48A;padding:11px 18px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
  .book-nav .navbtn:disabled{opacity:.35;cursor:default}
  .book-nav .navbtn .icon{width:18px;height:18px;stroke:currentColor}
  .page-ind{color:#D9C48A;font-size:14px;letter-spacing:.14em}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--gold-light);background:transparent;cursor:pointer;padding:0}
  .dots button.on{background:var(--gold-light)}
  .hint{color:#9FB0CC;text-align:center;font-size:13px;margin-top:12px}
  #musicBtn{position:fixed;right:16px;bottom:16px;z-index:50;display:none;align-items:center;gap:8px;background:var(--navy);color:#fff;border:1px solid rgba(230,201,135,.5);padding:11px 16px;border-radius:999px;cursor:pointer;font-weight:600;box-shadow:0 14px 30px rgba(14,27,51,.4)}
  #musicBtn.show{display:inline-flex}
  #musicBtn .icon{width:18px;height:18px;stroke:var(--gold-light)}
  #ytPlayer{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;z-index:1}
  .music-note{color:var(--muted);font-size:13px;text-align:center;margin-top:14px}
  @media(max-width:680px){
    .page,.book-stage{min-height:600px}
    .page{padding:40px 26px 34px}
    .grid3{grid-template-columns:1fr}
    .count{grid-template-columns:repeat(2,1fr)}
    .letter{font-size:17px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

<script>
  const target = new Date('2027-01-01T09:00:00+07:00');
  const $ = id => document.getElementById(id);
  const pages = [
    {
      title: 'Bìa sách',
      html: `<div class="cover">
        <div class="seal">15</div>
        <div class="small">Trân Trọng Kính Mời • Lớp 12A1</div>
        <div class="big serif gold-text">15</div>
        <div class="serif" style="font-size:20px;letter-spacing:.42em">NĂM</div>
        <h1 class="serif">Kỷ Niệm Ngày<br>Ra Trường</h1>
        <div><span class="class-badge"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 4 2 6 2s6-1 6-2v-5"/><path d="M22 10v5"/></svg>LỚP 12A1</span></div>
        <div class="ornament"><span>◆</span></div>
        <p><strong>Trường THPT Số 1 Mường Khương</strong><br>2012 — 2027</p>
        <p style="color:var(--muted)">Thứ Sáu • 01/01/2027 • 9 Giờ 00</p>
        <div class="actions"><button class="btn gold" type="button" data-action="open-book">Mở Sách</button></div>
        <p class="music-note">Mở sách để nghe bài hát về tuổi học trò.<br>Nhạc sẽ phát sau cú bấm này, có thể tắt hoặc bật lại ở góc dưới.</p>
      </div>`
    },
    {
      title: 'Lời mời',
      html: `<div class="letter">
        <h2 class="sec">Lời Mời</h2>
        <p class="sec-sub">Gửi tới các bạn Lớp 12A1, Trường THPT Số 1 Mường Khương.</p>
        <p>15 năm trôi qua kể từ ngày tập thể Lớp 12A1 rời mái trường THPT Số 1 Mường Khương. Mỗi người một hành trình, một cuộc sống riêng, nhưng ký ức về những năm tháng học trò, về thầy cô và bạn bè cùng lớp vẫn còn nguyên vẹn như ngày đầu.</p>
        <p>Nhân dịp kỷ niệm 15 năm ngày ra trường, Lớp 12A1 chúng ta cùng trở về: Gặp lại thầy cô, gặp lại nhau, cùng nhau ôn lại những câu chuyện cũ và viết tiếp một kỷ niệm mới cho lớp mình.</p>
        <p>Sự hiện diện của bạn chính là món quà ý nghĩa nhất cho ngày hội ngộ này. Hẹn gặp bạn lúc 9 giờ sáng, ngày 01/01/2027, tại ngôi trường thân thương của chúng ta.</p>
        <p style="text-align:right"><em>Trân trọng,<br><strong>Ban Tổ Chức Kỷ Niệm 15 Năm — Lớp 12A1</strong></em></p>
      </div>`
    },
    {
      title: 'Thời gian và địa điểm',
      html: `<h2 class="sec">Thời Gian Và Địa Điểm</h2>
        <p class="sec-sub">Thông tin chính thức của buổi kỷ niệm Lớp 12A1.</p>
        <div class="count" aria-live="off">
          <div><b id="d">—</b><span>Ngày</span></div>
          <div><b id="h">—</b><span>Giờ</span></div>
          <div><b id="m">—</b><span>Phút</span></div>
          <div><b id="s">—</b><span>Giây</span></div>
        </div>
        <div style="height:22px"></div>
        <div class="grid3">
          <div class="info"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><h4>Thời Gian</h4><p>9 Giờ 00<br>Thứ Sáu, Ngày 01/01/2027</p></div>
          <div class="info"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4-4.5-7-7.8-7-11a7 7 0 0 1 14 0c0 3.2-3 6.5-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><h4>Địa Điểm</h4><p>Trường THPT Số 1 Mường Khương<br>Mường Khương, Lào Cai</p></div>
          <div class="info"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1 4 2 6 2s6-1 6-2v-5"/><path d="M22 10v5"/></svg><h4>Lớp Kỷ Niệm</h4><p>Lớp 12A1<br>15 Năm Ngày Ra Trường<br>2012 — 2027</p></div>
        </div>
        <div class="actions">
          <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Tr%C6%B0%E1%BB%9Dng%20THPT%20S%E1%BB%91%201%20M%C6%B0%E1%BB%9Dng%20Kh%C6%B0%C6%A1ng">Chỉ Đường Tới Trường</a>
          <button class="btn light" type="button" data-action="calendar">Thêm Vào Lịch</button>
        </div>`
    },
    {
      title: 'Hành trình',
      html: `<h2 class="sec">Hành Trình 15 Năm</h2>
        <p class="sec-sub">Từ ngày Lớp 12A1 ra trường tới ngày trở về.</p>
        <div class="timeline">
          <article><h4>2012 — Lớp 12A1 Ra Trường</h4><p>Khép lại những năm tháng học trò tại Trường THPT Số 1 Mường Khương, mở ra một chặng đường mới.</p></article>
          <article><h4>2012 — 2027 — Mỗi Người Một Hành Trình</h4><p>15 năm trưởng thành, với biết bao đổi thay, nhưng tình bạn cùng lớp và ký ức về mái trường xưa vẫn còn đó.</p></article>
          <article><h4>01/01/2027 — Trở Về</h4><p>9 giờ sáng, Lớp 12A1 gặp lại nhau tại chính nơi mọi kỷ niệm bắt đầu.</p></article>
        </div>
        <div class="ornament"><span>◆</span></div>
        <p class="center" style="color:var(--muted)">Mỗi trang sách là một chặng đường.<br>Trang cuối cùng là ngày chúng ta gặp lại nhau.</p>`
    },
    {
      title: 'Xác nhận',
      html: `<div class="center">
        <h2 class="sec">Xác Nhận Tham Dự</h2>
        <p class="sec-sub">Bạn vui lòng bấm một lựa chọn để Ban tổ chức Lớp 12A1 nắm được số lượng. Hình thức tổng hợp chính thức sẽ được Ban tổ chức chốt và cập nhật thêm.</p>
        <div class="actions">
          <button class="btn gold" type="button" data-rsvp="Tôi sẽ tham dự">Tôi Sẽ Tham Dự</button>
          <button class="btn light" type="button" data-rsvp="Tiếc là tôi vắng mặt">Tiếc Là Tôi Vắng Mặt</button>
        </div>
        <p id="rsvpMsg" role="status"></p>
      </div>`
    },
    {
      title: 'Lời kết',
      html: `<div class="center quote">
        <div class="ornament"><span>◆</span></div>
        <p class="serif">“15 năm có thể làm thay đổi rất nhiều thứ,<br>nhưng không làm phai đi tình bạn thuở học trò.”</p>
        <h2 class="sec" style="margin-top:26px">Hẹn Gặp Lại Tại Mái Trường Xưa</h2>
        <p><strong>Lớp 12A1</strong> • 9 Giờ 00 — Thứ Sáu, Ngày 01/01/2027<br>Trường THPT Số 1 Mường Khương • Kỷ Niệm 15 Năm Ngày Ra Trường 2012 — 2027</p>
        <p class="music-note">Nhạc nền: Mong Ước Kỷ Niệm Xưa — Sáng tác: Nguyễn Xuân Phương, trình bày: Nhóm Mắt Ngọc, phát qua YouTube.<br>Nếu video không phát được, trang sẽ tự chuyển sang giai điệu không lời nhẹ nhàng.</p>
        <div class="actions"><button class="btn gold" type="button" data-action="first-page">Đọc Lại Từ Đầu</button></div>
      </div>`
    }
  ];

  let current = 0, animating = false;
  const pageEl = $('page'), stage = $('stage');
  function render(){
    pageEl.innerHTML = pages[current].html;
    $('pageInd').textContent = 'Trang ' + (current + 1) + ' / ' + pages.length;
    $('prevBtn').disabled = current === 0;
    $('nextBtn').disabled = current === pages.length - 1;
    const dots = $('dots'); dots.innerHTML = '';
    pages.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('aria-label', 'Tới trang ' + (i + 1));
      if (i === current) b.className = 'on';
      b.addEventListener('click', () => goTo(i));
      dots.appendChild(b);
    });
    stage.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  function goTo(index, fromCover){
    if (animating || index < 0 || index >= pages.length || index === current) return;
    const dir = index > current ? 'next' : 'prev';
    animating = true;
    pageEl.classList.add(dir === 'next' ? 'turn-next' : 'turn-prev');
    setTimeout(() => { current = index; render(); }, 430);
    setTimeout(() => { pageEl.classList.remove('turn-next', 'turn-prev'); animating = false; }, 880);
    if (fromCover) startMusic();
  }
  function next(){ goTo(current + 1); }
  function prev(){ goTo(current - 1); }
  $('nextBtn').addEventListener('click', next);
  $('prevBtn').addEventListener('click', prev);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });
  let touchX = null;
  stage.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (dx < -45) next(); else if (dx > 45) prev();
    touchX = null;
  }, {passive:true});
  stage.addEventListener('click', e => {
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x > rect.width * 0.72) next();
    else if (x < rect.width * 0.28) prev();
  });

  // Đếm ngược, chạy lại mỗi lần đổi trang vì phần tử được vẽ lại.
  function tick(){
    const d = $('d'); if (!d) return;
    let diff = Math.max(0, target - new Date());
    const days = Math.floor(diff / 86400000); diff -= days * 86400000;
    const hrs = Math.floor(diff / 3600000); diff -= hrs * 3600000;
    const mins = Math.floor(diff / 60000); diff -= mins * 60000;
    const secs = Math.floor(diff / 1000);
    d.textContent = days; $('h').textContent = String(hrs).padStart(2,'0');
    $('m').textContent = String(mins).padStart(2,'0'); $('s').textContent = String(secs).padStart(2,'0');
  }
  setInterval(tick, 1000);

  // Nhạc nền: bài hát về tuổi học trò qua YouTube, dự phòng bằng giai điệu Web Audio.
  let ytPlayer = null, ytReady = false, ytFailed = false, musicOn = false;
  let audioCtx = null, musicTimer = null, noteIndex = 0;
  const melody = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33];
  function playNote(freq){
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.045, now + 0.45);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + 2.0);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 2.1);
  }
  function startFallback(){
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; } }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (musicTimer) return;
    musicTimer = setInterval(() => { playNote(melody[noteIndex % melody.length]); noteIndex++; }, 2100);
    playNote(melody[0]); noteIndex = 1;
  }
  function stopFallback(){ if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
  function setMusicLabel(){ $('musicLabel').textContent = musicOn ? 'Tắt Nhạc' : 'Bật Nhạc'; }
  function startMusic(){
    if (musicOn) return;
    musicOn = true; setMusicLabel(); $('musicBtn').classList.add('show');
    if (ytReady && ytPlayer) { try { ytPlayer.setVolume(30); ytPlayer.playVideo(); return; } catch(e) {} }
    // Chờ YouTube tối đa 6 giây, nếu không phát được thì dùng giai điệu dự phòng.
    setTimeout(() => { if (musicOn && !ytReady) startFallback(); }, 6000);
    if (!ytReady) startFallback();
  }
  function stopMusic(){
    musicOn = false; setMusicLabel(); stopFallback();
    if (ytPlayer) { try { ytPlayer.pauseVideo(); } catch(e) {} }
  }
  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('ytPlayer', {
      height: '1', width: '1', videoId: 'Q6IrWD7cFUI',
      playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: 'Q6IrWD7cFUI', rel: 0 },
      events: {
        onReady: function(){ ytReady = true; if (musicOn) { ytPlayer.setVolume(30); ytPlayer.playVideo(); stopFallback(); } },
        onError: function(){ ytFailed = true; if (musicOn) startFallback(); },
        onStateChange: function(e){ if (e.data === 0 && musicOn) { try { ytPlayer.playVideo(); } catch(err) {} } }
      }
    });
  };
  $('musicBtn').addEventListener('click', () => { musicOn ? stopMusic() : startMusic(); });

  document.addEventListener('click', e => {
    const act = e.target.closest('[data-action]');
    if (act) {
      if (act.dataset.action === 'open-book') { goTo(1, true); }
      if (act.dataset.action === 'first-page') { goTo(0); }
      if (act.dataset.action === 'calendar') {
        const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ky niem 15 nam Lop 12A1//VI','BEGIN:VEVENT',
          'UID:15-nam-ra-truong-lop-12a1-2027@muong-khuong','DTSTAMP:20261022T100000Z',
          'DTSTART:20270101T020000Z','DTEND:20270101T050000Z',
          'SUMMARY:Kỷ niệm 15 năm ngày ra trường Lớp 12A1 2012-2027',
          'LOCATION:Trường THPT Số 1 Mường Khương','DESCRIPTION:Lớp 12A1. 9 giờ 00, Thứ Sáu, ngày 01/01/2027 tại Trường THPT Số 1 Mường Khương.',
          'END:VEVENT','END:VCALENDAR'].join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
        a.download = 'ky-niem-15-nam-lop-12a1-01012027.ics'; a.click();
        URL.revokeObjectURL(a.href);
      }
      return;
    }
    const rsvp = e.target.closest('[data-rsvp]');
    if (rsvp) {
      const msg = $('rsvpMsg');
      if (msg) msg.textContent = 'Cảm ơn bạn đã xác nhận: ' + rsvp.dataset.rsvp + '. Hẹn gặp bạn vào ngày 01/01/2027.';
      try { localStorage.setItem('rsvp-15-nam', rsvp.dataset.rsvp); } catch(err) {}
    }
  });

  render(); tick();
</script>
</body>
