<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kỷ Niệm 15 Năm Ngày Ra Trường — Lớp 12A1, 2012 - 2027 | Trường THPT Số 1 Mường Khương</title>
<meta name="description" content="Quyển sách thiệp mời kỷ niệm 15 năm ngày ra trường của Lớp 12A1, 2012 - 2027. Thời gian: 9 giờ 00, Thứ Sáu, ngày 01/01/2027 tại Trường THPT Số 1 Mường Khương.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDF7E7; --ink:#3D2E22; --navy:#4A3226; --navy2:#6B4A2F;
    --gold:#B89A6A; --gold-light:#E8C87A; --gold-dark:#7A4A22; --line:rgba(122,74,34,.38); --muted:#6B5A44;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(700px 420px at 50% -80px,rgba(255,240,190,.7),transparent 60%),linear-gradient(180deg,#EFE3C6,#E8DCC3 55%,#EFE3C6);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;line-height:1.8;min-height:100vh}
  a{color:inherit}
  .serif{font-family:"Playfair Display",Georgia,serif}
  .gold-text{background:linear-gradient(105deg,#8C6D2E,#C5A059 32%,#F0D48A 52%,#C5A059 72%,#8C6D2E);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
  @keyframes shine{0%,100%{background-position:0% center}50%{background-position:100% center}}
  .small{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
  .icon{width:32px;height:32px;stroke:var(--gold-dark);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 56px}

  .book{position:relative;background:linear-gradient(135deg,#D9C5A0,#E8D6B0 55%,#D9C5A0);padding:13px;border:1px solid rgba(122,74,34,.55);border-radius:22px;box-shadow:0 30px 70px rgba(74,50,38,.35)}
  .book:before{content:"";position:absolute;inset:7px;border:1px solid rgba(122,74,34,.35);border-radius:16px;pointer-events:none;z-index:30}
  .book-stage{position:relative;height:min(780px, calc(100svh - 170px));overflow:hidden;perspective:2000px;cursor:grab}
  .page{position:relative;background:repeating-linear-gradient(transparent 0 31px,rgba(160,120,60,.12) 31px 32px),linear-gradient(180deg,#FFFBEB,#FDF7E7 60%,#F7ECD2);padding:48px 48px 56px;height:100%;overflow:hidden;scrollbar-width:none;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(197,160,89,.35), inset 0 -30px 60px rgba(197,160,89,.08)}
  .page::-webkit-scrollbar{display:none}
  .page:before{content:"";position:absolute;inset:12px;border:1px solid rgba(122,74,34,.28);border-radius:10px;pointer-events:none}
  .page:after{content:"";position:absolute;top:0;bottom:0;left:0;width:10px;background:linear-gradient(90deg,rgba(74,50,38,.14),transparent);pointer-events:none}
  .page.is-cover{background:linear-gradient(180deg,#F7EAD0,#FDF7E7);color:#3D2E22}
  .page.is-cover .small{color:#7A4A22}
  .page.is-cover p{color:#5A4632}
  .page.is-cover strong{color:#3D2E22}

  /* Tờ giấy lật thật: xoay quanh gáy trái, chậm 1,4 giây, có bóng đổ ở mép. */
  .turn-sheet{position:absolute;inset:0;z-index:20;display:none;transform-origin:left center;transform:rotateY(0deg);transition:transform 1.5s cubic-bezier(.22,1,.36,1);backface-visibility:hidden;will-change:transform}
  .turn-sheet{border-radius:14px;overflow:hidden}
  .turn-sheet .turn-inner{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 31px,rgba(160,120,60,.12) 31px 32px),linear-gradient(180deg,#FFFBEB,#FDF7E7 60%,#F7ECD2);padding:48px 48px 56px;border-radius:14px;box-shadow:24px 0 60px rgba(0,0,0,.35)}
  .turn-sheet .turn-inner:before{content:"";position:absolute;inset:12px;border:1px solid rgba(122,74,34,.28);border-radius:10px;pointer-events:none}
  .turn-sheet .turn-inner:after{content:"";position:absolute;top:0;bottom:0;right:0;width:42px;background:linear-gradient(90deg,transparent,rgba(74,50,38,.22));pointer-events:none}
  .turn-sheet.is-cover .turn-inner{background:linear-gradient(180deg,#F7EAD0,#FDF7E7);color:#3D2E22}
  .turn-sheet.is-cover .turn-inner .small{color:#7A4A22}

  h2.sec{font-family:"Dancing Script",cursive;font-size:clamp(36px,6vw,46px);line-height:1.3;margin:0 0 8px;text-align:center;font-weight:700}
  .sec-sub{text-align:center;color:var(--muted);margin:0 0 28px}
  .ornament{display:flex;align-items:center;gap:14px;justify-content:center;margin:14px auto;color:var(--gold)}
  .ornament:before,.ornament:after{content:"";height:1px;width:64px;background:var(--line)}
  .btn{display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;background:var(--navy);color:#fff;padding:14px 26px;border-radius:999px;font-weight:600;letter-spacing:.4px;transition:transform .3s ease,box-shadow .3s ease;text-decoration:none;position:relative;overflow:hidden}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(74,50,38,.28)}
  .btn.gold{background:linear-gradient(105deg,#7A1A1A,#A32C2C,#C44A3A);color:#FFF7E7}
  .btn.gold:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s ease}
  .btn.gold:hover:after{left:130%}
  .btn.light{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .page-fit{transition:transform .35s ease}
  .chapter{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dark);font-weight:600;text-align:center;margin:0 0 6px}
  .prompt-box{margin-top:14px;border:1px dashed rgba(122,74,34,.55);border-radius:14px;padding:10px 14px;background:#FFF3B0;text-align:center;cursor:pointer}
  .prompt-btn{display:block;width:100%;background:transparent;border:0;color:var(--gold-dark);font-weight:700;cursor:pointer;font-size:15px;letter-spacing:.06em;padding:10px 6px}
  .prompt-text{margin:6px 0 0;font-size:14px;line-height:1.5;text-wrap:balance;color:var(--ink)}
  .prompt-count{display:block;margin-top:6px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .prompt-answers{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .ans-btn{flex:1;max-width:120px;padding:9px 6px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;cursor:pointer;font-size:14px}
  .ans-btn.selected{background:var(--navy);color:#F0D48A;border-color:var(--navy)}
  .prompt-answer-msg{display:none}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
  .confetti i{position:absolute;top:-16px;width:9px;height:14px;animation:confetti-fall 3.2s ease-in forwards}
  @keyframes confetti-fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
  .progress{height:3px;background:rgba(122,74,34,.22);border-radius:999px;margin-top:16px;overflow:hidden}
  .progress div{height:100%;background:linear-gradient(90deg,#7A4A22,#A32C2C);border-radius:999px;transition:width .6s ease}
  .dust{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;opacity:.35}
  .dust i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:#C9A86A;animation:rise 14s linear infinite}
  .dust i:nth-child(1){left:8%;animation-delay:0s}.dust i:nth-child(2){left:22%;animation-delay:3s;animation-duration:17s}.dust i:nth-child(3){left:38%;animation-delay:6s}.dust i:nth-child(4){left:55%;animation-delay:1s;animation-duration:19s}.dust i:nth-child(5){left:70%;animation-delay:8s}.dust i:nth-child(6){left:85%;animation-delay:4s;animation-duration:16s}.dust i:nth-child(7){left:93%;animation-delay:10s}.dust i:nth-child(8){left:47%;animation-delay:12s}
  @keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-105vh);opacity:0}}
  .cover{text-align:center;padding-top:24px}
  .env-box{border:2px solid #4A3226;border-radius:12px;padding:26px 20px;background:#FFFBEB}
  .hand{font-family:"Dancing Script",cursive;font-size:clamp(40px,8vw,56px);line-height:1.15;margin:8px 0;font-weight:700}
  .stamp{display:inline-block;border:2px dashed #A32C2C;padding:8px 14px;font-weight:700;color:#A32C2C;transform:rotate(2deg);margin-top:10px}
  .cover p{text-wrap:balance}
  .seal{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#D95A4A,#A32C2C 60%,#7A1A1A);color:#FFF7E7;font-family:"Playfair Display",serif;font-size:24px;font-weight:900;box-shadow:0 14px 28px rgba(122,26,26,.4),0 0 0 6px rgba(163,44,44,.15)}
  .cover .big{font-size:clamp(90px,20vw,150px);line-height:.85;margin:10px 0 0;font-weight:900}
  .cover h1{font-size:clamp(30px,5.5vw,48px);line-height:1.25;margin:10px 0;font-weight:700;text-wrap:balance}
  .letter{font-size:16px;line-height:1.6;text-align:justify;text-align-last:left}
  .letter p{margin:0 0 12px}
  .detail{display:flex;align-items:flex-start;gap:14px;justify-content:flex-start;max-width:520px;margin:16px auto;font-size:18px}
  .detail-text span{display:block;line-height:1.55;text-wrap:balance}
  .detail-text .d2{font-size:16px;color:var(--muted)}
  .foot-note{color:var(--muted);font-size:15px;line-height:1.65;text-wrap:balance}
  .quote{font-size:clamp(22px,5vw,28px);line-height:1.55;text-wrap:balance}
  .count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:26px auto 0}
  .count div{background:#4A3226;color:#FFF7E7;padding:16px 6px;text-align:center;border:1px solid rgba(122,74,34,.5)}
  .count b{display:block;font-family:"Playfair Display",serif;font-size:clamp(26px,5vw,38px);line-height:1;color:var(--gold-light)}
  .count span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
  .count-label{text-align:center;color:var(--muted);margin:24px 0 0;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .detail .icon{width:24px;height:24px}
  .timeline{max-width:600px;margin:0 auto;position:relative;padding-left:0}
  .timeline:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:rgba(163,44,44,.45)}
  .timeline article{position:relative;padding:0 0 20px 36px}
  .timeline article:before{content:"";position:absolute;left:0;top:7px;width:13px;height:13px;background:#A32C2C;border:2px solid #FDF7E7;box-shadow:0 0 0 1px rgba(163,44,44,.5);transform:translateX(-50%) rotate(45deg)}
  .timeline h4{margin:0;font-size:18px;text-wrap:balance}
  .timeline p{margin:4px 0 0;color:var(--muted)}
  .center{text-align:center}
  .invite-page{padding-top:4px}
  .actions{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;margin-top:24px}
  .actions .btn{min-width:260px;justify-content:center}
  #rsvpMsg{margin-top:16px;font-weight:600;color:#1F6B3A;min-height:24px;text-align:center;text-wrap:balance}
  .rsvp-modal{position:fixed;inset:0;background:rgba(74,50,38,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .rsvp-modal.open{display:flex}
  .rsvp-card{background:#FDF7E7;border:1px solid rgba(122,74,34,.55);border-radius:20px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.5);text-align:left}
  .rsvp-card h3{font-family:"Playfair Display",serif;font-size:24px;margin:0;text-align:center}
  .rsvp-choice{text-align:center;color:var(--gold-dark);font-weight:700;margin:8px 0 4px}
  .rsvp-card label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
  .rsvp-card input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;color:var(--ink)}
  #rsvpError{margin:10px 0 0;font-size:14px;color:#B42318;min-height:20px;text-align:center}

  @media (max-width:600px){
    .page{padding:28px 22px 24px}
    h2.sec{font-size:28px}
    .ornament{margin:10px auto}
    .letter{font-size:15px;line-height:1.55}
    .letter p{margin:0 0 10px}
    .prompt-box{margin-top:12px;padding:12px}
    .prompt-btn{font-size:14px;padding:8px 6px}
    .prompt-text{font-size:14px;line-height:1.5}
    .prompt-count{margin-top:4px}
    .prompt-answers{margin-top:8px}
    .ans-btn{padding:8px 6px;font-size:14px}
    .detail{font-size:16px;margin:12px auto}
    .quote{font-size:20px}
    .cover{padding-top:24px}
  }
  @media (max-width:600px) and (max-height:720px){
    .page{padding:24px 20px 20px}
    .letter{font-size:14px;line-height:1.5}
    h2.sec{font-size:26px}
    .prompt-box{padding:10px}
  }
  .book-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .navbtn{background:transparent;border:1px solid rgba(122,74,34,.55);border-radius:999px;color:#4A3226;padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center}
  .navbtn:disabled{opacity:.3;cursor:default}
  .navbtn .icon{width:20px;height:20px;stroke:currentColor}
  .page-ind{color:#4A3226;font-size:14px;letter-spacing:.18em}
  .music-row{display:flex;justify-content:center;margin-top:14px}
  #musicBtn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#FFF7E7;border:1px solid rgba(122,74,34,.5);padding:11px 20px;border-radius:999px;cursor:pointer;font-weight:600;box-shadow:0 14px 30px rgba(74,50,38,.35)}
  #musicBtn .icon{width:18px;height:18px;stroke:#E8C87A}
  #bgAudio{display:none}
  @media(max-width:680px){
    .page,.turn-sheet .turn-inner{padding:32px 26px 44px}
  }
  @media (max-height:720px){
    .page,.turn-sheet .turn-inner{padding:28px 24px 24px}
    h2.sec{font-size:26px}
    .sec-sub{margin-bottom:16px}
    .letter{font-size:14.5px;line-height:1.55}
    .detail{font-size:16px;margin:10px auto}
    .quote{font-size:19px}
    .cover{padding-top:20px}
    .cover .big{font-size:100px}
    .count{margin-top:14px}
    .count div{padding:12px 6px}
  }
  @media (max-height:600px){
    .letter{font-size:13.5px;line-height:1.5}
    .detail{font-size:15px}
    .quote{font-size:18px}
    .prompt-box{padding:8px 10px}
  }
  @media (max-width:480px){
    .wrap{padding:16px 10px 40px}
    .book{padding:9px}
    .page,.turn-sheet .turn-inner{padding:28px 12px 24px}
    .detail{font-size:16px}
    .quote{font-size:17px}
  }
  .final-page .quote{font-size:21px;line-height:1.45}
  .final-page .actions{gap:8px;margin-top:14px}
  .final-page .actions .btn{min-width:220px;padding:11px 20px}
  .final-page .count{margin-top:12px}
  .final-page .count div{padding:10px 6px}
  .final-page .count-label{margin-top:12px}
  @media (max-width:360px){
    .quote{font-size:15px}
  }
  @media(prefers-reduced-motion:reduce){
    .turn-sheet{transition:none}
    .dust{display:none}
  }
</style>
</head>
<body>
<div class="dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="book" id="book">
    <div class="book-stage" id="stage">
      <div class="page" id="page"></div>
      <div class="turn-sheet" id="turnSheet"><div class="turn-inner" id="turnInner"></div></div>
    </div>
  </div>
  <div class="book-nav">
    <button class="navbtn" id="prevBtn" type="button" aria-label="Trang trước"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="page-ind" id="pageInd">1 / 8</div>
    <button class="navbtn" id="nextBtn" type="button" aria-label="Trang sau"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="progress"><div id="progressBar" style="width:12.5%"></div></div>
  <div class="music-row">
    <button id="musicBtn" type="button" aria-label="Bật hoặc tắt nhạc nền">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span id="musicLabel">Bật Nhạc</span>
    </button>
  </div>
</div>

<audio id="bgAudio" src="music.mp3" loop preload="auto" autoplay playsinline></audio>

<script>
  const $ = id => document.getElementById(id);
  const pages = [
    {
      cover: true,
      html: `<div class="cover"><div class="env-box">
        <div class="small">Thư Gửi Từ Năm 2012 • Lớp 12A1</div>
        <div class="seal">12A1</div>
        <div class="hand">Gửi bạn, 15 năm sau</div>
        <h1 class="serif" style="font-size:clamp(24px,4.5vw,34px);line-height:1.3;margin:6px 0">Kỷ Niệm Ngày Ra Trường</h1>
        <div class="ornament"><span>◆</span></div>
        <p>Người gửi: Lớp 12A1<br>Người nhận: Bạn, người bạn cùng lớp năm ấy</p>
        <p><strong>Trường THPT Số 1 Mường Khương</strong><br>2012 — 2027</p>
        <p>Thứ Sáu • 01/01/2027 • 9 Giờ 00</p>
        <div><span class="stamp">Mường Khương — 01/01/2027</span></div>
        <div class="actions"><button class="btn gold" type="button" data-action="open-book">Mở Thư Ra Xem</button></div>
      </div></div>`
    },
    {
      html: `<div class="chapter">Mở Đầu</div>
        <h2 class="sec">Lời Mở Đầu</h2>
        <div class="ornament"><span>◆</span></div>
        <div class="letter">
          <p>Mười lăm năm trước, chúng ta cùng bước vào một lớp học, cùng ngồi dưới một mái trường, cùng lớn lên trong những buổi sáng đến lớp và những buổi chiều tan học vội vã.</p>
          <p>Thời gian đưa mỗi người đi một hướng khác nhau. Có người ở lại quê hương, có người lập nghiệp nơi xa, nhưng có một điều không thay đổi: chúng ta vẫn là Lớp 12A1 của nhau.</p>
          <p>Cuốn sách này là lời hẹn trở về. Hãy mở từng trang thật chậm, để đến trang cuối cùng, chúng ta lại gặp nhau.</p>
          <p style="text-align:right"><em>Thân gửi Lớp 12A1.</em></p>
        </div>`
    },
    {
      html: `<div class="chapter">Chương 1</div>
        <h2 class="sec">Lớp Học Năm Ấy</h2>
        <div class="ornament"><span>◆</span></div>
        <div class="letter">
          <p>Nhớ những buổi sáng đến lớp, tiếng trống trường vang lên, cả lớp vội vã vào chỗ ngồi, bảng đen còn thơm mùi phấn mới.</p>
          <p>Giờ ra chơi, sân trường rộn ràng tiếng cười. Những câu chuyện chưa kể hết đã phải quay lại lớp, hẹn nhau kể tiếp vào giờ sau.</p>
          <p>Có những bài học khó, những lần kiểm tra hồi hộp, những lúc giận nhau rồi lại làm lành ngay trong ngày. Ngồi cạnh nhau, mọi thứ đều nhẹ nhàng hơn rất nhiều.</p>

      // Điền khi có Form/Sheet: RSVP_ENDPOINT là địa chỉ formResponse của Google Form liên kết với Sheet mới,
      // RSVP_FIELDS là 3 mã entry của 3 câu hỏi Họ và tên, Số điện thoại, Xác nhận. Chưa điền thì chưa gửi lên Sheet.
      // Không mở trang biểu mẫu: chỉ gửi ngầm trong nền, người dùng ở lại trong quyển sách.
      const RSVP_ENDPOINT = 'https://docs.google.com/forms/d/e/1FAIpQLSebNQLPKc1FsZSU4_S9bnA90uKVRlP3sB2icpHYwsGxvw9mQw/formResponse';
      const RSVP_FIELDS = { name: 'entry.1478877037', phone: 'entry.496907100', choice: 'entry.165629815' };
      const choice = modal ? modal.dataset.choice : '';
      const done = () => {
        if (modal) modal.classList.remove('open');
        if (msg) {
          if (choice === 'Tôi sẽ tham dự') {
            msg.textContent = 'Chúc mừng ' + name + '! Hẹn gặp bạn vào 9 giờ 00, Thứ Sáu, ngày 01/01/2027 tại Trường THPT Số 1 Mường Khương, Lớp 12A1!';
            celebrate();
          } else {
            msg.textContent = 'Cảm ơn ' + name + ' đã xác nhận: ' + choice + '. Hẹn gặp bạn vào ngày 01/01/2027.';
          }
        }
        if (nameEl) nameEl.value = ''; if (phoneEl) phoneEl.value = '';
        try { localStorage.setItem('rsvp-15-nam', choice); } catch(e2) {}
      };
      if (!RSVP_ENDPOINT || !RSVP_FIELDS.name || !RSVP_FIELDS.phone || !RSVP_FIELDS.choice) {
        if (err) err.textContent = 'Form xác nhận đang chờ kết nối Google Sheet, chưa gửi được. Vui lòng quay lại sau.';
        return;
      }
      const fd = new FormData();
      fd.append(RSVP_FIELDS.name, name); fd.append(RSVP_FIELDS.phone, phone); fd.append(RSVP_FIELDS.choice, choice);
      fetch(RSVP_ENDPOINT, { method: 'POST', mode: 'no-cors', body: fd })
        .then(done)
        .catch(() => { if (err) err.textContent = 'Gửi chưa thành công, bạn vui lòng bấm lại.'; });
    }
  });

  // Đếm ngược tới 9 giờ 00 ngày 01/01/2027, chạy lại mỗi giây và chỉ cập nhật khi trang Lời mời đang hiển thị.
  const targetDate = new Date('2027-01-01T09:00:00+07:00');
  function tick(){
    const d = $('d'); if (!d) return;
    let diff = Math.max(0, targetDate - new Date());
    const days = Math.floor(diff / 86400000); diff -= days * 86400000;
    const hrs = Math.floor(diff / 3600000); diff -= hrs * 3600000;
    const mins = Math.floor(diff / 60000); diff -= mins * 60000;
    const secs = Math.floor(diff / 1000);
    d.textContent = days; $('h').textContent = String(hrs).padStart(2,'0');
    $('m').textContent = String(mins).padStart(2,'0'); $('s').textContent = String(secs).padStart(2,'0');
  }
  setInterval(tick, 1000);

  render(); tick();
  window.addEventListener('resize', () => fitInner(pageEl));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitInner(pageEl));
</script>
<div class="rsvp-modal" id="rsvpModal" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
  <div class="rsvp-card">
    <h3 id="rsvpTitle">Xác Nhận Tham Dự</h3>
    <p class="rsvp-choice" id="rsvpChoice"></p>
    <label for="rsvpName">Họ và tên</label>
    <input id="rsvpName" type="text" autocomplete="name" placeholder="Nhập họ và tên của bạn">
    <label for="rsvpPhone">Số điện thoại</label>
    <input id="rsvpPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Nhập số điện thoại 10 số">
    <p id="rsvpError" role="alert"></p>
    <div class="actions">
      <button class="btn gold" type="button" id="rsvpSend">Gửi Xác Nhận</button>
      <button class="btn light" type="button" id="rsvpCancel">Đóng</button>
    </div>
  </div>
</div>
</body>
</html>
